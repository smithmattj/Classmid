    padding: "8px 14px", borderRadius: 7, cursor: "pointer",
    border: `1px solid ${active ? C.brass : C.string}`,
    background: active ? "rgba(156,61,46,0.10)" : "transparent",
    color: active ? C.brass : C.ink,
  }),
};

/* Six horizontal "strings" used as the wordmark underline */
function StringMotif() {
  const widths = [1, 1, 1.4, 1.4, 1.8, 2.2];
  return (
    <div aria-hidden="true" style={{ marginTop: 14 }}>
      {widths.map((w, i) => (
        <div key={i} style={{
          height: w, background: i === 4 ? C.brassDeep : C.string,
          marginBottom: 6, borderRadius: 2,
        }} />
      ))}
    </div>
  );
}

function ClassMid() {
  const [midi, setMidi] = useState(null);
  const [fileName, setFileName] = useState("");
  const [error, setError] = useState("");
  const [selIdxs, setSelIdxs] = useState([]);
  const [tuningKey, setTuningKey] = useState("standard");
  const [transpose, setTranspose] = useState(0);
  const [maxFret, setMaxFret] = useState(15);
  const [fold, setFold] = useState(true);
  const [copied, setCopied] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [showAllShifts, setShowAllShifts] = useState(false);
  const [overrides, setOverrides] = useState({});
  const [selectedEv, setSelectedEv] = useState(null);
  const [playing, setPlaying] = useState(false);
  const [activeEv, setActiveEv] = useState(-1);
  const [speed, setSpeed] = useState(1);
  const [thin, setThin] = useState(0);
  const [leadIdxs, setLeadIdxs] = useState([]);
  const [library, setLibrary] = useState(null);
  const [libBusy, setLibBusy] = useState(null);
  const fileRef = useRef(null);
  const audioRef = useRef(null);
  const audioCtxRef = useRef(null);

  // Shared: turn a downloaded/selected buffer into a parsed score.
  const acceptBuffer = useCallback(async (buf, rawName) => {
    const head = new Uint8Array(buf.slice(0, 4));
    let parsed;
    if (head[0] === 0x4d && head[1] === 0x54 && head[2] === 0x68 && head[3] === 0x64) {
      parsed = parseMidi(buf); // 'MThd'
    } else if (head[0] === 0x50 && head[1] === 0x4b) {
      parsed = parseMusicXML(await unzipMxl(buf)); // 'PK' — compressed .mxl
    } else {
      const text = new TextDecoder().decode(buf);
      if (text.includes("<score-partwise") || text.includes("<score-timewise")) parsed = parseMusicXML(text);
      else throw new Error("That doesn't look like a MIDI or MusicXML file.");
    }
    if (!parsed.tracks.length) throw new Error("That file parsed, but no notes were found in it.");
    setMidi(parsed);
    setFileName(String(rawName || "score").replace(/\.(mid|midi|musicxml|mxl|xml)$/i, ""));
    setSelIdxs(parsed.tracks.length === 1 ? [0] : []);
    setTranspose(0);
    setOverrides({});
    setSelectedEv(null);
    setLeadIdxs([]);
  }, []);

  const loadFile = useCallback((file) => {
    setError(""); setCopied(false);
    const rd = new FileReader();
    rd.onload = async () => {
      try { await acceptBuffer(rd.result, file.name); }
      catch (e) { setError(e.message || "Couldn't read that file."); }
    };
    rd.onerror = () => setError("Couldn't read that file.");
    rd.readAsArrayBuffer(file);
  }, [acceptBuffer]);

  // The score library lives alongside the app (scores/library.json in the same
  // repo), so it's same-origin — no proxies, no cross-origin problems.
  useEffect(() => {
    let live = true;
    fetch("scores/library.json")
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        if (!live || !j) return;
        const items = Array.isArray(j) ? j : j.pieces;
        if (Array.isArray(items) && items.length) setLibrary(items);
      })
      .catch(() => { /* no library published — the section stays hidden */ });
    return () => { live = false; };
  }, []);

  const loadFromLibrary = useCallback(async (item) => {
    setError(""); setCopied(false); setLibBusy(item.file);
    try {
      const resp = await fetch("scores/" + item.file);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const buf = await resp.arrayBuffer();
      await acceptBuffer(buf, item.title || item.file);
    } catch (e) {
      setError("Couldn't load " + (item.title || item.file) + (e.message ? " (" + e.message + ")" : "") + ".");
    } finally {
      setLibBusy(null);
    }
  }, [acceptBuffer]);

  const tuning = TUNINGS[tuningKey].pitches;
  const track = useMemo(() => {
    if (!midi || !selIdxs.length) return null;
    if (selIdxs.length === 1) return midi.tracks[selIdxs[0]];
    const notes = selIdxs.flatMap(i =>
      midi.tracks[i].notes.map(n => (leadIdxs.includes(i) ? { ...n, dom: true } : n))
    ).sort((a, b) => a.start - b.start || a.pitch - b.pitch);
    return {
      name: selIdxs.map(i => midi.tracks[i].name).join(" + "),
      notes,
      lo: Math.min(...notes.map(n => n.pitch)),
      hi: Math.max(...notes.map(n => n.pitch)),
      merged: true,
    };
  }, [midi, selIdxs, leadIdxs]);

  const result = useMemo(() => {
    if (!midi || !track) return null;
    const grouped = groupEvents(track.notes, transpose, midi.tpq);
    const arranged = thin === 3
      ? classicalArrange(grouped, midi.tpq, midi.timeSig)
      : thinEvents(grouped, thin);
    const events = arranged.events, thinned = arranged.removed, keyName = arranged.keyName || null;
    const { events: fretted, dropped, folded } = fretPass(events, tuning, maxFret, fold, { overrides });
    const measureTicks = Math.round(midi.timeSig.num * midi.tpq * 4 / midi.timeSig.den);
    const layout = layoutTab(fretted, tuning, midi.tpq, measureTicks);
    const fretsUsed = fretted.flatMap(ev => ev.notes.filter(n => n.f > 0).map(n => n.f));
    const posLo = fretsUsed.length ? Math.min(...fretsUsed) : 0;
    const posHi = fretsUsed.length ? Math.max(...fretsUsed) : 0;
    const chords = fretted.filter(ev => ev.notes.length > 1).length;
    const totalPitches = events.reduce((a, e) => a + e.pitches.length, 0);
    const difficulty = difficultyOf(fretted, totalPitches ? dropped / totalPitches : 0);
    return { fretted, ascii: layout.text, layout, dropped, folded, thinned, keyName, measureTicks, posLo, posHi, chords, eventCount: fretted.length, difficulty };
  }, [midi, track, transpose, tuning, maxFret, fold, overrides, thin]);

  const rangeInfo = useMemo(() => {
    if (!track) return null;
    const loLimit = Math.min(...tuning), hiLimit = Math.max(...tuning) + maxFret;
    let below = 0, above = 0;
    for (const n of track.notes) {
      const pt = n.pitch + transpose;
      if (pt < loLimit) below++; else if (pt > hiLimit) above++;
    }
    return { below, above, total: track.notes.length };
  }, [track, transpose, tuning, maxFret]);

  // Rate every transposition from -12 to +12 with a fast, sampled fretting pass.
  const survey = useMemo(() => {
    if (!midi || !track) return null;
    const loLimit = Math.min(...tuning), hiLimit = Math.max(...tuning) + maxFret;
    const rows = [];
    for (let shift = -12; shift <= 12; shift++) {
      let fit = 0;
      for (const n of track.notes) {
        const pt = n.pitch + shift;
        if (pt >= loLimit && pt <= hiLimit) fit++;
      }
      const grp = groupEvents(track.notes, shift, midi.tpq);
      const arr = thin === 3 ? classicalArrange(grp, midi.tpq, midi.timeSig) : thinEvents(grp, thin);
      const events = sampleEvents(arr.events, 400);
      const totalPitches = events.reduce((a, e) => a + e.pitches.length, 0);
      const { events: fr, dropped } = fretPass(events, tuning, maxFret, fold, { beam: 6, candCap: 12 });
      const diff = difficultyOf(fr, totalPitches ? dropped / totalPitches : 0);
      rows.push({ shift, fitPct: Math.round(100 * fit / track.notes.length), pct: diff.pct, label: diff.label });
    }
    return rows;
  }, [midi, track, tuning, maxFret, fold, thin]);

  const [surveySort, setSurveySort] = useState("difficulty");
  const sortedSurvey = useMemo(() => {
    if (!survey) return null;
    const rows = [...survey];
    if (surveySort === "fit") rows.sort((a, b) => b.fitPct - a.fitPct || a.pct - b.pct || Math.abs(a.shift) - Math.abs(b.shift));
    else rows.sort((a, b) => a.pct - b.pct || b.fitPct - a.fitPct || Math.abs(a.shift) - Math.abs(b.shift));
    return rows;
  }, [survey, surveySort]);

  const autoFit = () => {
    if (!track) return;
    const loLimit = Math.min(...tuning), hiLimit = Math.max(...tuning) + maxFret;
    let best = 0, bestFit = -1;
    for (let k = -3; k <= 3; k++) {
      const shift = transpose + k * 12;
      let fit = 0;
      for (const n of track.notes) {
        const pt = n.pitch + shift;
        if (pt >= loLimit && pt <= hiLimit) fit++;
      }
      if (fit > bestFit || (fit === bestFit && Math.abs(shift) < Math.abs(best))) { bestFit = fit; best = shift; }
    }
    setTranspose(best);
    setSelectedEv(null);
  };

  const applyTranspose = (updater) => { setSelectedEv(null); setTranspose(updater); };

  /* --- Playback --- */
  const stopPlayback = useCallback(() => {
    const a = audioRef.current;
    if (a) {
      clearInterval(a.timer);
      cancelAnimationFrame(a.raf);
      try { a.master.gain.setTargetAtTime(0.0001, a.ctx.currentTime, 0.02); } catch (e) { /* noop */ }
      setTimeout(() => { try { a.master.disconnect(); } catch (e) { /* noop */ } }, 150);
      audioRef.current = null;
    }
    setPlaying(false);
    setActiveEv(-1);
  }, []);

  useEffect(() => { stopPlayback(); }, [result, speed, stopPlayback]);
  useEffect(() => () => {
    stopPlayback();
    const c = audioCtxRef.current;
    if (c) { try { c.close(); } catch (e) { /* noop */ } audioCtxRef.current = null; }
  }, [stopPlayback]);

  const playFrom = (startIdxWanted) => {
    stopPlayback();
    if (!result || !result.fretted.length || !midi) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtxRef.current || audioCtxRef.current.state === "closed") audioCtxRef.current = new AC();
    const ctx = audioCtxRef.current;

    const begin = () => {
      const master = ctx.createGain(); master.gain.value = 0.45; master.connect(ctx.destination);
      const secPerTick = 60 / ((midi.bpm || 120) * speed * midi.tpq);
      const evs = result.fretted;
      const startIdx = Math.min(Math.max(0, startIdxWanted || 0), evs.length - 1);
      const t0Tick = evs[startIdx].tick;
      const startTime = ctx.currentTime + 0.12;
      const last = evs[evs.length - 1];
      const endTime = startTime + (last.tick - t0Tick) * secPerTick + Math.min(2.5, last.dur * secPerTick) + 0.4;
      const st = { ctx, master, timer: null, raf: null, i: startIdx, j: startIdx };
      const scheduleUntil = (horizon) => {
        while (st.i < evs.length) {
          const ev = evs[st.i];
          const t = startTime + (ev.tick - t0Tick) * secPerTick;
          if (t > horizon) break;
          const durS = Math.min(2.5, Math.max(0.15, ev.dur * secPerTick));
          for (const n of ev.notes) pluck(ctx, master, 440 * Math.pow(2, (n.pitch - 69) / 12), t, durS);
          st.i++;
        }
      };
      scheduleUntil(ctx.currentTime + 1.5);
      st.timer = setInterval(() => { if (audioRef.current === st) scheduleUntil(st.ctx.currentTime + 1.5); }, 350);
      const frame = () => {
        if (audioRef.current !== st) return;
        const now = st.ctx.currentTime;
        const curTick = t0Tick + (now - startTime) / secPerTick;
        while (st.j + 1 < evs.length && evs[st.j + 1].tick <= curTick) st.j++;
        setActiveEv(now >= startTime ? st.j : -1);
        if (now > endTime) { stopPlayback(); return; }
        st.raf = requestAnimationFrame(frame);
      };
      st.raf = requestAnimationFrame(frame);
      audioRef.current = st;
      setPlaying(true);
    };

    // iOS and in-app browsers start the context suspended; resume must run
    // inside this tap, and scheduling only makes sense once the clock is live.
    if (ctx.state === "suspended") ctx.resume().then(begin).catch(begin);
    else begin();
  };

  const togglePlay = () => {
    if (playing) stopPlayback();
    else playFrom(selectedEv != null ? selectedEv : 0);
  };

  /* --- Refingering --- */
  const sameFingering = (a, b) => a.length === b.length && a.every(n => b.some(m => m.s === n.s && m.f === n.f));
  const stringLabel = (s) => {
    const nm = NOTE_NAMES[tuning[s] % 12];
    return (s === 5 ? "high e" : s === 0 ? "low " + nm : nm) + " string";
  };
  // Which note within the selected hit is being moved: null = the whole hit.
  const [selNotePitch, setSelNotePitch] = useState(null);
  useEffect(() => { setSelNotePitch(null); }, [selectedEv]);

  // All legal placements for one pitch, keeping the rest of the chord where it is.
  const singleNoteOptions = (ev, pitch) => {
    const target = ev.notes.find(n => n.pitch === pitch);
    if (!target) return null;
    const used = new Set(ev.notes.filter(n => n !== target).map(n => n.s));
    const options = [];
    for (let s = 0; s < 6; s++) {
      if (used.has(s)) continue;
      const f = pitch - tuning[s];
      if (f >= 0 && f <= maxFret) options.push({ s, f, pitch });
    }
    options.sort((a, b) => a.s - b.s);
    return { target, options };
  };

  const cycleFingering = (dir) => {
    if (selectedEv == null || !result) return;
    const ev = result.fretted[selectedEv];
    if (!ev) return;
    const pitches = [...new Set(ev.notes.map(n => n.pitch))].sort((a, b) => a - b);
    const key = ev.tick + "_" + pitches.join(".");
    if (selNotePitch != null) {
      // Move just this note; the rest of the chord stays put.
      const sn = singleNoteOptions(ev, selNotePitch);
      if (!sn || sn.options.length < 2) return;
      let idx = sn.options.findIndex(o => o.s === sn.target.s && o.f === sn.target.f);
      idx = ((idx < 0 ? 0 : idx) + dir + sn.options.length) % sn.options.length;
      const newNotes = ev.notes.filter(n => n !== sn.target).concat([sn.options[idx]]);
      setOverrides(o => ({ ...o, [key]: newNotes }));
      return;
    }
    const cands = chordCandidates(pitches, tuning, maxFret, 40);
    if (cands.length < 2) return;
    let idx = cands.findIndex(c => sameFingering(c.notes, ev.notes));
    idx = ((idx < 0 ? 0 : idx) + dir + cands.length) % cands.length;
    setOverrides(o => ({ ...o, [key]: cands[idx].notes }));
  };
  const resetFingering = () => {
    if (selectedEv == null || !result) return;
    const ev = result.fretted[selectedEv];
    if (!ev) return;
    const pitches = [...new Set(ev.notes.map(n => n.pitch))].sort((a, b) => a - b);
    setOverrides(o => { const c = { ...o }; delete c[ev.tick + "_" + pitches.join(".")]; return c; });
  };

  const copyTab = async () => {
    if (!result) return;
    try { await navigator.clipboard.writeText(result.ascii); setCopied(true); setTimeout(() => setCopied(false), 1600); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = result.ascii; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      setCopied(true); setTimeout(() => setCopied(false), 1600);
    }
  };

  const exportXml = () => {
    if (!result || !midi) return;
    const xml = buildMusicXML(result.fretted, midi.tpq, midi.timeSig, tuning, fileName || "ClassMid export");
    download((fileName || "classmid") + ".musicxml", xml, "application/vnd.recordare.musicxml+xml");
  };

  const exportPdf = () => {
    if (!result || !midi) return;
    const blocks = result.layout.blocks.map(cols => {
      const ruler = cols.map(c => c.ruler).join("");
      const lines = [0, 1, 2, 3, 4, 5].map(li => cols.map(c => c.cells[li]).join(""));
      const leads = [[], [], [], [], [], []];
      let off = 0;
      for (const c of cols) {
        if (c.kind === "ev" && c.lead) {
          for (let li = 0; li < 6; li++) {
            if (c.lead[li] && c.num && c.num[li]) leads[li].push({ start: off + c.num[li].start, len: c.num[li].len });
          }
        }
        off += c.cells[0].length;
      }
      return { lines, leads, ruler };
    });
    const t = TUNINGS[tuningKey];
    const parts = [
      t.label + " tuning (" + t.sub + ")",
      (midi.bpm || 120) + " bpm",
      midi.timeSig.num + "/" + midi.timeSig.den,
      "difficulty " + result.difficulty.pct + "% (" + result.difficulty.label + ")",
    ];
    if (transpose !== 0) parts.push("transposed " + (transpose > 0 ? "+" : "") + transpose + " st");
    if (thin === 1) parts.push("octave doubles thinned");
    else if (thin === 2) parts.push("essentials only");
    else if (thin === 3) parts.push("classical arrangement" + (result.keyName ? " in " + result.keyName : ""));
    if (leadIdxs.length > 0 && selIdxs.length > 1) parts.push((leadIdxs.length === 1 ? "lead: " : "leads: ") + leadIdxs.map(i => midi.tracks[i].name).join(", "));
    const pdf = makePdf({
      title: fileName || "ClassMid arrangement",
      subtitle: parts.join("  -  "),
      blocks,
      footerBrand: "ClassMid",
    });
    download((fileName || "classmid") + "-tab.pdf", pdf, "application/pdf");
  };

  const reset = () => { stopPlayback(); setMidi(null); setSelIdxs([]); setError(""); setTranspose(0); setFileName(""); setOverrides({}); setSelectedEv(null); setLeadIdxs([]); };

  return (
    <div style={S.page}>
      <style>{fontImport}</style>
      <div style={S.wrap}>

        {/* Header */}
        <header style={{ paddingTop: 40 }}>
          <h1 style={{ ...S.display, fontSize: 44, fontWeight: 700, margin: 0, letterSpacing: "-0.02em" }}>
            Class<span style={{ color: C.brass }}>Mid</span>
          </h1>
          <p style={{ margin: "8px 0 0", color: C.inkDim, fontSize: 15, maxWidth: 460 }}>
            MIDI in. Playable tab out. Pick a track, shape it to your guitar, export as ASCII tab or MusicXML.
          </p>
          <StringMotif />
        </header>

        {/* Step 1 — Upload */}
        <section style={S.panel} className="cm-fade">
          <div style={S.eyebrow}>Movement I — Load a MIDI or MusicXML file</div>
          {!midi ? (
            <div
              role="button" tabIndex={0} className="cm-card"
              onClick={() => fileRef.current && fileRef.current.click()}
              onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") fileRef.current.click(); }}
              onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={(e) => { e.preventDefault(); setDragOver(false); const f = e.dataTransfer.files[0]; if (f) loadFile(f); }}
              style={{
                border: `2px dashed ${dragOver ? C.brass : C.string}`, borderRadius: 10,
                padding: "38px 20px", textAlign: "center", cursor: "pointer",
                background: dragOver ? "rgba(156,61,46,0.05)" : "transparent",
              }}
            >
              <div style={{ ...S.mono, fontSize: 22, color: C.brass, marginBottom: 8 }}>♪ → e|--3--5--7--|</div>
              <div style={{ fontSize: 15 }}>Drop a .mid, .musicxml or .mxl file here, or tap to choose one</div>
              <div style={{ fontSize: 13, color: C.inkDim, marginTop: 6 }}>Everything runs in your browser — the file never leaves this page.</div>
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
              <div>
                <div style={{ fontWeight: 600 }}>{fileName || "MIDI file"}</div>
                <div style={{ fontSize: 13, color: C.inkDim }}>
                  {midi.tracks.length} track{midi.tracks.length === 1 ? "" : "s"} · {midi.timeSig.num}/{midi.timeSig.den} · {midi.tpq} ticks per beat
                </div>
              </div>
              <button className="cm-btn" style={S.btn(false)} onClick={reset}>Load a different file</button>
            </div>
          )}
          <input ref={fileRef} type="file" accept=".mid,.midi,.musicxml,.mxl,.xml,audio/midi" style={{ display: "none" }}
            onChange={(e) => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ""; }} />
          {error && <div style={{ marginTop: 12, color: C.warn, fontSize: 14 }}>{error}</div>}

          {library && !midi && (
            <div style={{ marginTop: 18, paddingTop: 14, borderTop: `1px solid ${C.string}` }}>
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 2 }}>Or start from the library</div>
              <div style={{ fontSize: 12.5, color: C.inkDim, marginBottom: 10 }}>
                Scores kept with the app — tap one to load it straight in.
              </div>
              <div style={{ display: "grid", gap: 6 }}>
                {library.map((item, i) => (
                  <button key={i} className="cm-card"
                    onClick={() => loadFromLibrary(item)}
                    disabled={libBusy != null}
                    style={{
                      textAlign: "left", padding: "10px 12px", borderRadius: 8, cursor: "pointer",
                      border: `1px solid ${C.string}`, background: C.panelHi, color: C.ink,
                      fontFamily: "'IBM Plex Sans', sans-serif",
                      opacity: libBusy != null && libBusy !== item.file ? 0.5 : 1,
                    }}>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
                      <span style={{ fontSize: 14, fontWeight: 600 }}>{item.title || item.file}</span>
                      {libBusy === item.file && <span style={{ ...S.mono, fontSize: 12, color: C.brass }}>loading…</span>}
                    </div>
                    {(item.composer || item.note) && (
                      <div style={{ fontSize: 12.5, color: C.inkDim, marginTop: 2 }}>
                        {item.composer || ""}{item.composer && item.note ? " · " : ""}{item.note || ""}
                      </div>
                    )}
                  </button>
                ))}
              </div>
            </div>
          )}


        </section>

        {/* Step 2 — Track */}
        {midi && (
          <section style={S.panel} className="cm-fade">
            <div style={S.eyebrow}>Movement II — Choose the track to arrange</div>
            <div style={{ fontSize: 13, color: C.inkDim, marginBottom: 10 }}>
              Tap one track — or tap several to merge them into a single arrangement (bass + melody works well).
            </div>
            <div style={{ display: "grid", gap: 8 }}>
              {midi.tracks.map((t, i) => (
                <button key={i} className="cm-card"
                  onClick={() => {
                    stopPlayback(); setSelectedEv(null); setOverrides({}); setCopied(false);
                    setSelIdxs(s => {
                      if (s.includes(i)) { setLeadIdxs(d => d.filter(x => x !== i)); return s.filter(x => x !== i); }
                      return [...s, i];
                    });
                  }}
                  style={{
                    textAlign: "left", padding: "12px 14px", borderRadius: 8, cursor: "pointer",
                    border: `1px solid ${selIdxs.includes(i) ? C.brass : C.string}`,
                    background: selIdxs.includes(i) ? "rgba(156,61,46,0.07)" : C.panelHi,
                    color: C.ink, fontFamily: "'IBM Plex Sans', sans-serif",
                  }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 600, fontSize: 15 }}>
                      {t.name}{t.isDrums && <span style={{ color: C.warn, fontWeight: 400 }}> — percussion, won't tab well</span>}
                    </span>
                    <span style={{ ...S.mono, fontSize: 12, color: C.inkDim }}>{t.notes.length} notes</span>
                  </div>
                  <div style={{ fontSize: 13, color: C.inkDim, marginTop: 3 }}>
                    {t.instr && t.instr !== t.name ? t.instr + " · " : ""}range {pitchName(t.lo)}–{pitchName(t.hi)}
                  </div>
                  {selIdxs.includes(i) && selIdxs.length > 1 && (
                    <span role="button" tabIndex={0}
                      onClick={(e) => { e.stopPropagation(); setSelectedEv(null); setOverrides({}); setLeadIdxs(d => d.includes(i) ? d.filter(x => x !== i) : [...d, i]); }}
                      onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.stopPropagation(); e.preventDefault(); setLeadIdxs(d => d.includes(i) ? d.filter(x => x !== i) : [...d, i]); } }}
                      style={{
                        display: "inline-block", marginTop: 8, fontSize: 12.5, padding: "4px 10px", borderRadius: 6,
                        border: `1px solid ${leadIdxs.includes(i) ? C.brass : C.string}`,
                        color: leadIdxs.includes(i) ? C.brass : C.inkDim,
                        cursor: "pointer", fontFamily: "'IBM Plex Mono', monospace",
                      }}>
                      {leadIdxs.includes(i) ? "★ Lead — protected from thinning" : "☆ Mark as lead"}
                    </span>
                  )}
                </button>
              ))}
            </div>
            {selIdxs.length > 1 && (
              <div style={{ marginTop: 10, fontSize: 13, color: C.brass, ...S.mono }}>
                ⌁ Merging {selIdxs.length} tracks into one arrangement.
              </div>
            )}
          </section>
        )}

        {/* Step 3 — Shape */}
        {track && (
          <section style={S.panel} className="cm-fade">
            <div style={S.eyebrow}>Movement III — Shape it to the instrument</div>

            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
              {Object.entries(TUNINGS).map(([k, t]) => (
                <button key={k} className="cm-btn" style={S.chip(tuningKey === k)} onClick={() => { setSelectedEv(null); setTuningKey(k); }}>
                  {t.label} <span style={{ ...S.mono, fontSize: 11, opacity: 0.75 }}>{t.sub}</span>
                </button>
              ))}
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
              <span style={{ fontSize: 14, color: C.inkDim, minWidth: 80 }}>Transpose</span>
              <button className="cm-btn" style={S.btn(false)} onClick={() => applyTranspose(t => t - 12)}>−12</button>
              <button className="cm-btn" style={S.btn(false)} onClick={() => applyTranspose(t => t - 1)}>−1</button>
              <span style={{ ...S.mono, minWidth: 44, textAlign: "center", fontSize: 15, color: transpose === 0 ? C.inkDim : C.brass }}>
                {transpose > 0 ? "+" + transpose : transpose}
              </span>
              <button className="cm-btn" style={S.btn(false)} onClick={() => applyTranspose(t => t + 1)}>+1</button>
              <button className="cm-btn" style={S.btn(false)} onClick={() => applyTranspose(t => t + 12)}>+12</button>
              <button className="cm-btn" style={{ ...S.btn(false), color: C.brass, borderColor: C.brassDeep }} onClick={autoFit}>Auto-fit octave</button>
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap", marginBottom: 14 }}>
              <label style={{ fontSize: 14, color: C.inkDim }}>
                Highest fret{" "}
                <select value={maxFret} onChange={(e) => setMaxFret(+e.target.value)}
                  style={{ ...S.mono, background: C.panelHi, color: C.ink, border: `1px solid ${C.string}`, borderRadius: 6, padding: "6px 8px", fontSize: 14, marginLeft: 6 }}>
                  {[12, 15, 17, 19, 22, 24].map(f => <option key={f} value={f}>{f}</option>)}
                </select>
              </label>
              <label style={{ fontSize: 14, color: C.inkDim, display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                <input type="checkbox" checked={fold} onChange={(e) => setFold(e.target.checked)} style={{ accentColor: C.brass, width: 16, height: 16 }} />
                Fold out-of-range notes up or down an octave
              </label>
            </div>

            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 14, color: C.inkDim, marginBottom: 6 }}>Thin the arrangement</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {[{ v: 0, l: "Off" }, { v: 1, l: "Octave doubles" }, { v: 2, l: "Essentials only" }, { v: 3, l: "Classical" }].map(o => (
                  <button key={o.v} className="cm-btn" style={S.chip(thin === o.v)}
                    onClick={() => { setSelectedEv(null); setThin(o.v); }}>{o.l}</button>
                ))}
              </div>
              <div style={{ fontSize: 12.5, color: C.inkDim, marginTop: 6, maxWidth: 560 }}>
                {thin === 0 ? "Every note as written."
                  : thin === 1 ? "Drops notes doubled in another octave, keeping the bass voicing and the melody on top."
                  : thin === 2 ? "Keeps bass, melody, and the strongest colour tones (thirds and sevenths); drops octave doubles, fifths and extra inner voices. Chords cap at four notes."
                  : "A musicality pass for classical guitar. Detects the key, then weighs every note: melody and strong-beat bass are protected, and the rest are ranked by metric position, duration, and harmonic function — thirds and sevenths over fifths and doublings, with chromatic notes kept as expressive. Notes re-struck while their string would still be ringing are dropped, and the texture breathes: two voices in fast passages, up to five where the music sits on a downbeat."}
                {thin > 0 && leadIdxs.length > 0 && selIdxs.length > 1 && (leadIdxs.length === 1 ? " The lead track is never thinned — every one of its notes stays." : " The lead tracks are never thinned — every one of their notes stays.")}
              </div>
            </div>

            {rangeInfo && (
              <div style={{ fontSize: 13, ...S.mono, color: (rangeInfo.below + rangeInfo.above) === 0 ? C.ok : C.warn }}>
                {(rangeInfo.below + rangeInfo.above) === 0
                  ? "✓ Every note fits this tuning and fret range."
                  : `${rangeInfo.below + rangeInfo.above} of ${rangeInfo.total} notes fall outside the neck (${rangeInfo.below} low, ${rangeInfo.above} high)` +
                    (fold ? " — folding them in by octave." : " — they'll be dropped. Try transposing, or switch folding on.")}
              </div>
            )}

            {sortedSurvey && (
              <div style={{ marginTop: 20 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
                  <span style={{ fontSize: 14, color: C.inkDim }}>Every transposition, rated. Sort by</span>
                  <button className="cm-btn" style={{ ...S.chip(surveySort === "difficulty"), padding: "5px 11px", fontSize: 13 }}
                    onClick={() => setSurveySort("difficulty")}>Easiest first</button>
                  <button className="cm-btn" style={{ ...S.chip(surveySort === "fit"), padding: "5px 11px", fontSize: 13 }}
                    onClick={() => setSurveySort("fit")}>Best fit first</button>
                </div>
                <div style={{ display: "grid", gap: 6 }}>
                  {(showAllShifts ? sortedSurvey : sortedSurvey.slice(0, 8)).map(r => (
                    <button key={r.shift} className="cm-btn"
                      onClick={() => applyTranspose(r.shift)}
                      style={{
                        display: "flex", alignItems: "center", gap: 10, padding: "8px 12px",
                        borderRadius: 7, cursor: "pointer",
                        border: `1px solid ${transpose === r.shift ? C.brass : C.string}`,
                        background: transpose === r.shift ? "rgba(156,61,46,0.07)" : C.panelHi,
                        color: C.ink, fontFamily: "'IBM Plex Sans', sans-serif",
                      }}>
                      <span style={{ ...S.mono, minWidth: 56, textAlign: "left", fontSize: 13, color: r.shift === 0 ? C.ink : C.brass }}>
                        {r.shift === 0 ? "as is" : (r.shift > 0 ? "+" : "") + r.shift + " st"}
                      </span>
                      <span style={{ flex: 1, height: 6, background: "#E3DECE", borderRadius: 3, overflow: "hidden" }}>
                        <span style={{ display: "block", height: "100%", width: r.pct + "%", background: r.pct < 40 ? C.ok : r.pct < 70 ? C.brass : C.warn }} />
                      </span>
                      <span style={{ ...S.mono, fontSize: 12, minWidth: 110, textAlign: "right", color: C.inkDim }}>
                        {r.pct}% · {r.label}{surveySort === "fit" || r.fitPct < 100 ? " · " + r.fitPct + "% fit" : ""}
                      </span>
                    </button>
                  ))}
                </div>
                {sortedSurvey.length > 8 && (
                  <button className="cm-btn" style={{ ...S.btn(false), marginTop: 8, fontSize: 13 }}
                    onClick={() => setShowAllShifts(v => !v)}>
                    {showAllShifts ? "Show the top 8" : "Show all 25 transpositions"}
                  </button>
                )}
              </div>
            )}
          </section>
        )}

        {/* Step 4 — Tab + export */}
        {result && result.eventCount > 0 && (
          <section style={S.panel} className="cm-fade">
            <div style={S.eyebrow}>Movement IV — The tab</div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap", marginBottom: 6 }}>
              <span style={{ ...S.display, fontSize: 36, fontWeight: 700, color: C.brass, lineHeight: 1 }}>
                {result.difficulty.pct}%
              </span>
              <span style={{ fontSize: 15, fontWeight: 600 }}>{result.difficulty.label} to play</span>
              <span style={{ fontSize: 12, color: C.inkDim, ...S.mono }}>
                stretch {result.difficulty.avgSpan.toFixed(1)} · shift {result.difficulty.avgMove.toFixed(1)} frets/move · avg fret {result.difficulty.avgFret.toFixed(1)}
              </span>
            </div>
            <div style={{ fontSize: 13, color: C.inkDim, marginBottom: 12, ...S.mono }}>
              {result.eventCount} events · {result.chords} chords · hand works frets {result.posLo}–{result.posHi}
              {result.keyName ? ` · arranged in ${result.keyName}` : ""}
              {result.thinned > 0 ? ` · ${result.thinned} notes thinned out` : ""}
              {result.folded > 0 ? ` · ${result.folded} notes octave-folded` : ""}
              {result.dropped > 0 ? ` · ${result.dropped} dropped` : ""}
            </div>

            <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
              <button className="cm-btn" style={S.btn(true)} onClick={togglePlay}>
                {playing ? "◼ Stop" : selectedEv != null ? "▶ Play from selection" : "▶ Play"}
              </button>
              <label style={{ fontSize: 13, color: C.inkDim }}>
                Speed{" "}
                <select value={speed} onChange={(e) => setSpeed(+e.target.value)}
                  style={{ ...S.mono, background: C.panelHi, color: C.ink, border: `1px solid ${C.string}`, borderRadius: 6, padding: "5px 7px", fontSize: 13 }}>
                  {[0.5, 0.75, 1, 1.25].map(s => <option key={s} value={s}>{s}×</option>)}
                </select>
              </label>
              <span style={{ ...S.mono, fontSize: 12, color: C.inkDim }}>{midi.bpm} bpm</span>
              {Object.keys(overrides).length > 0 && (
                <button className="cm-btn" style={{ ...S.btn(false), fontSize: 13 }} onClick={() => setOverrides({})}>
                  Clear {Object.keys(overrides).length} custom fingering{Object.keys(overrides).length === 1 ? "" : "s"}
                </button>
              )}
            </div>
            <div style={{ fontSize: 12.5, color: C.inkDim, marginTop: -6, marginBottom: 12 }}>
              No sound on an iPhone? Flip the ring/silent switch to ring and nudge the volume — browser audio obeys both.
            </div>

            {selectedEv != null && result.fretted[selectedEv] && (() => {
              const ev = result.fretted[selectedEv];
              const pitches = [...new Set(ev.notes.map(n => n.pitch))].sort((a, b) => a - b);
              const sorted = [...ev.notes].sort((a, b) => b.s - a.s);
              const noteMode = selNotePitch != null && ev.notes.some(n => n.pitch === selNotePitch);
              let posText;
              if (noteMode) {
                const sn = singleNoteOptions(ev, selNotePitch);
                const cur = sn.options.findIndex(o => o.s === sn.target.s && o.f === sn.target.f);
                posText = "string " + ((cur < 0 ? 0 : cur) + 1) + " of " + sn.options.length + " available for " + pitchName(selNotePitch);
              } else {
                const cands = chordCandidates(pitches, tuning, maxFret, 40);
                const cur = cands.findIndex(c => sameFingering(c.notes, ev.notes));
                posText = "position " + ((cur < 0 ? 0 : cur) + 1) + " of " + cands.length;
              }
              return (
                <div style={{ border: `1px solid ${C.brassDeep}`, background: "rgba(156,61,46,0.05)", borderRadius: 8, padding: "10px 12px", marginBottom: 12 }}>
                  <div style={{ fontSize: 13, marginBottom: 8, lineHeight: 1.5 }}>
                    <span style={{ color: C.brass, fontWeight: 600 }}>Selected hit: </span>
                    {sorted.map(n => pitchName(n.pitch) + " — fret " + n.f + " on the " + stringLabel(n.s)).join("; ")}
                    <span style={{ color: C.inkDim }}> · {posText}</span>
                  </div>
                  {ev.notes.length > 1 && (
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8, alignItems: "center" }}>
                      <span style={{ fontSize: 12.5, color: C.inkDim }}>Move:</span>
                      <button className="cm-btn" style={{ ...S.chip(!noteMode), padding: "4px 10px", fontSize: 12.5 }}
                        onClick={() => setSelNotePitch(null)}>Whole hit</button>
                      {sorted.map(n => (
                        <button key={n.pitch} className="cm-btn"
                          style={{ ...S.chip(noteMode && selNotePitch === n.pitch), padding: "4px 10px", fontSize: 12.5 }}
                          onClick={() => setSelNotePitch(p => p === n.pitch ? null : n.pitch)}>
                          {pitchName(n.pitch)} only
                        </button>
                      ))}
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <button className="cm-btn" style={{ ...S.btn(false), fontSize: 13, color: C.brass, borderColor: C.brassDeep }} onClick={() => playFrom(selectedEv)}>▶ Play from here</button>
                    <button className="cm-btn" style={{ ...S.btn(false), fontSize: 13 }} onClick={() => cycleFingering(-1)}>{noteMode ? "◀ Previous string" : "◀ Previous position"}</button>
                    <button className="cm-btn" style={{ ...S.btn(false), fontSize: 13 }} onClick={() => cycleFingering(1)}>{noteMode ? "Next string ▶" : "Next position ▶"}</button>
                    <button className="cm-btn" style={{ ...S.btn(false), fontSize: 13 }} onClick={resetFingering}>Reset</button>
                    <button className="cm-btn" style={{ ...S.btn(false), fontSize: 13 }} onClick={() => setSelectedEv(null)}>Close</button>
                  </div>
                </div>
              );
            })()}

            <div style={{
              ...S.mono, fontSize: 13, lineHeight: 1.5, background: "#FFFEF9",
              border: `1px solid ${C.string}`, borderRadius: 8, padding: 16,
              overflowX: "auto", color: C.ink, maxHeight: 420, overflowY: "auto",
            }}>
              {result.layout.blocks.map((cols, bi) => (
                <div key={bi} style={{ marginBottom: 14 }}>
                  <div style={{ whiteSpace: "pre" }}>
                    {cols.map((c, ci) => c.kind === "ev" ? (
                      <span key={ci}
                        onClick={() => { if (playing) playFrom(c.evIndex); else setSelectedEv(s => s === c.evIndex ? null : c.evIndex); }}
                        style={{
                          cursor: "pointer", borderRadius: 2,
                          color: c.downbeat ? C.brass : C.inkDim,
                          fontWeight: c.onBeat ? 600 : 400,
                          background: c.evIndex === activeEv ? "rgba(95,126,82,0.24)"
                            : c.evIndex === selectedEv ? "rgba(156,61,46,0.16)" : "transparent",
                        }}>{c.ruler}</span>
                    ) : c.kind === "grid" ? (
                      <span key={ci} style={{
                        color: c.downbeat ? C.brass : C.inkDim,
                        fontWeight: c.onBeat ? 600 : 400,
                      }}>{c.ruler}</span>
                    ) : (
                      <span key={ci} style={{ color: C.string }}>{c.ruler}</span>
                    ))}
                  </div>
                  {[0, 1, 2, 3, 4, 5].map(li => (
                    <div key={li} style={{ whiteSpace: "pre" }}>
                      {cols.map((c, ci) => c.kind === "ev" ? (
                        <span key={ci}
                          onClick={() => { if (playing) playFrom(c.evIndex); else setSelectedEv(s => s === c.evIndex ? null : c.evIndex); }}
                          style={{
                            cursor: "pointer", borderRadius: 2,
                            background: c.evIndex === activeEv ? "rgba(95,126,82,0.24)"
                              : c.evIndex === selectedEv ? "rgba(156,61,46,0.16)" : "transparent",
                          }}>
                          {c.lead && c.lead[li] && c.num[li] ? (
                            <>
                              {c.cells[li].slice(0, c.num[li].start)}
                              <span style={{ color: C.lead, fontWeight: 600 }}>
                                {c.cells[li].slice(c.num[li].start, c.num[li].start + c.num[li].len)}
                              </span>
                              {c.cells[li].slice(c.num[li].start + c.num[li].len)}
                            </>
                          ) : c.cells[li]}
                        </span>
                      ) : c.kind === "grid" ? (
                        <span key={ci}>{c.cells[li]}</span>
                      ) : (
                        <span key={ci} style={{ color: C.inkDim }}>{c.cells[li]}</span>
                      ))}
                    </div>
                  ))}
                </div>
              ))}
            </div>
            <div style={{ fontSize: 13, color: C.inkDim, marginTop: 10 }}>
              Tap any hit in the tab to select it — then play from that point, cycle the whole hit through its alternative positions, or pick one note of a chord and move just that note between strings. The engine re-optimises the passage around whatever you pin. While it's playing, tap anywhere in the score to jump there.
              {leadIdxs.length > 0 && selIdxs.length > 1 && (
                <> Notes from the lead {leadIdxs.length === 1 ? "track" : "tracks"} are shown in <span style={{ color: C.lead, fontWeight: 600 }}>blue</span>, here and in the PDF.</>
              )}
            </div>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 14 }}>
              <button className="cm-btn" style={S.btn(true)} onClick={copyTab}>{copied ? "Copied ✓" : "Copy tab"}</button>
              <button className="cm-btn" style={S.btn(false)} onClick={() => download((fileName || "classmid") + "-tab.txt", result.ascii, "text/plain")}>Download .txt</button>
              <button className="cm-btn" style={S.btn(false)} onClick={exportPdf}>Download PDF</button>
              <button className="cm-btn" style={S.btn(false)} onClick={exportXml}>Download MusicXML</button>
            </div>
            <p style={{ fontSize: 13, color: C.inkDim, marginTop: 12, marginBottom: 0 }}>
              The MusicXML carries string and fret numbers on a six-line TAB staff, so Guitar Pro, MuseScore and TuxGuitar will open it as tab with your tuning intact.
            </p>
          </section>
        )}

        {result && result.eventCount === 0 && (
          <section style={S.panel} className="cm-fade">
            <div style={{ color: C.warn, fontSize: 14 }}>
              Nothing in this track lands on the neck with the current settings. Transpose it toward the guitar's range, raise the highest fret, or switch octave folding on.
            </div>
          </section>
        )}

        <footer style={{ marginTop: 32, fontSize: 12, color: C.inkDim, ...S.mono }}>
          ClassMid · the fretting engine weighs stretch, position shifts and open strings to keep the arrangement under one hand.
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ClassMid />);
</script>
</body>
</html>
