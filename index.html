<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useCallback, useEffect } = React;

/* ============================================================
   ClassMid — MIDI in. Playable tab out.
   ============================================================ */

/* ---------- MIDI parsing ---------- */

const GM = ["Acoustic Grand Piano","Bright Piano","Electric Grand","Honky-tonk","Electric Piano 1","Electric Piano 2","Harpsichord","Clavinet","Celesta","Glockenspiel","Music Box","Vibraphone","Marimba","Xylophone","Tubular Bells","Dulcimer","Drawbar Organ","Percussive Organ","Rock Organ","Church Organ","Reed Organ","Accordion","Harmonica","Tango Accordion","Nylon Guitar","Steel Guitar","Jazz Guitar","Clean Guitar","Muted Guitar","Overdriven Guitar","Distortion Guitar","Guitar Harmonics","Acoustic Bass","Fingered Bass","Picked Bass","Fretless Bass","Slap Bass 1","Slap Bass 2","Synth Bass 1","Synth Bass 2","Violin","Viola","Cello","Contrabass","Tremolo Strings","Pizzicato Strings","Harp","Timpani","String Ensemble 1","String Ensemble 2","Synth Strings 1","Synth Strings 2","Choir Aahs","Voice Oohs","Synth Voice","Orchestra Hit","Trumpet","Trombone","Tuba","Muted Trumpet","French Horn","Brass Section","Synth Brass 1","Synth Brass 2","Soprano Sax","Alto Sax","Tenor Sax","Baritone Sax","Oboe","English Horn","Bassoon","Clarinet","Piccolo","Flute","Recorder","Pan Flute","Blown Bottle","Shakuhachi","Whistle","Ocarina","Square Lead","Sawtooth Lead","Calliope","Chiff","Charang","Voice Lead","Fifths","Bass + Lead","New Age Pad","Warm Pad","Polysynth","Choir Pad","Bowed Pad","Metallic Pad","Halo Pad","Sweep Pad","Rain FX","Soundtrack","Crystal","Atmosphere","Brightness","Goblins","Echoes","Sci-Fi","Sitar","Banjo","Shamisen","Koto","Kalimba","Bagpipe","Fiddle","Shanai","Tinkle Bell","Agogo","Steel Drums","Woodblock","Taiko Drum","Melodic Tom","Synth Drum","Reverse Cymbal","Fret Noise","Breath Noise","Seashore","Bird Tweet","Telephone","Helicopter","Applause","Gunshot"];

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const pitchName = (p) => NOTE_NAMES[p % 12] + (Math.floor(p / 12) - 1);

function parseMidi(buf) {
  const d = new Uint8Array(buf);
  let p = 0;
  const str = (n) => { let s = ""; for (let i = 0; i < n; i++) s += String.fromCharCode(d[p + i]); p += n; return s; };
  const u32 = () => { const v = (d[p] << 24) | (d[p + 1] << 16) | (d[p + 2] << 8) | d[p + 3]; p += 4; return v >>> 0; };
  const u16 = () => { const v = (d[p] << 8) | d[p + 1]; p += 2; return v; };
  if (str(4) !== "MThd") throw new Error("Not a MIDI file (missing MThd header).");
  const hlen = u32();
  const format = u16();
  const ntrks = u16();
  let division = u16();
  p += hlen - 6;
  let tpq = 480;
  if (division & 0x8000) tpq = 480; else tpq = division || 480;

  const rawTracks = [];
  let timeSig = { num: 4, den: 4 };
  let gotTimeSig = false;
  let bpm = 120;
  let gotTempo = false;

  for (let t = 0; t < ntrks && p < d.length; t++) {
    if (str(4) !== "MTrk") break;
    const len = u32();
    const end = p + len;
    let tick = 0, status = 0;
    const notes = [];
    const open = {};
    let name = "";
    const programs = {};
    const channels = new Set();

    const vlq = () => { let v = 0, b; do { b = d[p++]; v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };

    while (p < end) {
      tick += vlq();
      let b = d[p];
      if (b & 0x80) { status = b; p++; if (b >= 0xf0) status = b; }
      const type = status & 0xf0, ch = status & 0x0f;
      if (status === 0xff) {
        const meta = d[p++]; const mlen = vlq();
        if (meta === 0x03 && !name) { let s = ""; for (let i = 0; i < mlen; i++) s += String.fromCharCode(d[p + i]); name = s; }
        if (meta === 0x58 && !gotTimeSig) { timeSig = { num: d[p], den: Math.pow(2, d[p + 1]) }; gotTimeSig = true; }
        if (meta === 0x51 && !gotTempo && mlen >= 3) {
          const uspq = (d[p] << 16) | (d[p + 1] << 8) | d[p + 2];
          if (uspq > 0) { bpm = Math.round(60000000 / uspq); gotTempo = true; }
        }
        p += mlen;
      } else if (status === 0xf0 || status === 0xf7) {
        const slen = vlq(); p += slen;
      } else if (type === 0x90 || type === 0x80) {
        const pitch = d[p++], vel = d[p++];
        channels.add(ch);
        const key = ch * 128 + pitch;
        if (type === 0x90 && vel > 0) {
          if (open[key] == null) open[key] = { pitch, start: tick, ch };
        } else {
          const o = open[key];
          if (o) { notes.push({ pitch, start: o.start, dur: Math.max(1, tick - o.start), ch }); delete open[key]; }
        }
      } else if (type === 0xa0 || type === 0xb0 || type === 0xe0) { p += 2;
      } else if (type === 0xc0) { programs[ch] = d[p++]; channels.add(ch);
      } else if (type === 0xd0) { p += 1;
      } else { p++; }
    }
    for (const k in open) { const o = open[k]; notes.push({ pitch: o.pitch, start: o.start, dur: tpq, ch: o.ch }); }
    p = end;
    rawTracks.push({ name, notes, programs, channels });
  }

  // Build selectable tracks. For format 0 (or any track mixing channels), split by channel.
  const tracks = [];
  for (const rt of rawTracks) {
    if (rt.notes.length === 0) continue;
    const byCh = {};
    for (const n of rt.notes) (byCh[n.ch] = byCh[n.ch] || []).push(n);
    const chKeys = Object.keys(byCh);
    for (const chk of chKeys) {
      const ch = +chk;
      const notes = byCh[chk].sort((a, b) => a.start - b.start || a.pitch - b.pitch);
      const prog = rt.programs[ch];
      const instr = ch === 9 ? "Drum kit" : (prog != null ? GM[prog] : null);
      let nm = rt.name || instr || "Untitled";
      if (chKeys.length > 1) nm += " · ch " + (ch + 1);
      const lo = Math.min(...notes.map(n => n.pitch));
      const hi = Math.max(...notes.map(n => n.pitch));
      tracks.push({ name: nm, instr, notes, ch, lo, hi, isDrums: ch === 9 });
    }
  }
  tracks.sort((a, b) => (a.isDrums ? 1 : 0) - (b.isDrums ? 1 : 0) || b.notes.length - a.notes.length);
  return { tpq, timeSig, tracks, format, bpm };
}

/* ---------- MusicXML parsing ---------- */

async function unzipMxl(buf) {
  const d = new DataView(buf);
  const u8 = new Uint8Array(buf);
  let e = buf.byteLength - 22;
  while (e >= 0 && d.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error("Not a valid .mxl archive.");
  const count = d.getUint16(e + 10, true);
  let off = d.getUint32(e + 16, true);
  const td = new TextDecoder();
  const entries = [];
  for (let i = 0; i < count; i++) {
    if (d.getUint32(off, true) !== 0x02014b50) break;
    const method = d.getUint16(off + 10, true);
    const csize = d.getUint32(off + 20, true);
    const nlen = d.getUint16(off + 28, true);
    const elen = d.getUint16(off + 30, true);
    const clen = d.getUint16(off + 32, true);
    const lho = d.getUint32(off + 42, true);
    const name = td.decode(u8.slice(off + 46, off + 46 + nlen));
    entries.push({ name, method, csize, lho });
    off += 46 + nlen + elen + clen;
  }
  const cands = entries.filter(x => /\.(xml|musicxml)$/i.test(x.name) && !/^META-INF/i.test(x.name));
  const entry = cands[0];
  if (!entry) throw new Error("No MusicXML found inside the .mxl archive.");
  const lh = entry.lho;
  const nl = d.getUint16(lh + 26, true), el = d.getUint16(lh + 28, true);
  const dataStart = lh + 30 + nl + el;
  const comp = u8.slice(dataStart, dataStart + entry.csize);
  if (entry.method === 0) return td.decode(comp);
  if (entry.method === 8) {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("This browser can't unpack compressed .mxl — export uncompressed MusicXML (.musicxml) instead.");
    }
    const stream = new Blob([comp]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const out = await new Response(stream).arrayBuffer();
    return td.decode(new Uint8Array(out));
  }
  throw new Error("Unsupported compression inside the .mxl archive.");
}

function parseMusicXML(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("Couldn't parse that MusicXML file.");
  if (!doc.querySelector("score-partwise")) {
    throw new Error(doc.querySelector("score-timewise")
      ? "This is timewise MusicXML — export it as partwise (the default in most apps)."
      : "No score-partwise document found in that file.");
  }
  const tpq = 480;
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const txt = (parent, sel) => { const n = parent.querySelector(sel); return n ? n.textContent : null; };
  const partNames = {};
  doc.querySelectorAll("part-list score-part").forEach(sp => {
    partNames[sp.getAttribute("id")] = txt(sp, "part-name") || "";
  });
  let timeSig = null, bpm = null;
  const tracks = [];
  doc.querySelectorAll("score-partwise > part").forEach((part, pi) => {
    let divisions = 1;
    let pos = 0, lastStart = 0;
    const notes = [];
    const openTies = {}; // pitch -> note object with a tie left open
    part.querySelectorAll(":scope > measure").forEach(meas => {
      for (const el of meas.children) {
        const tag = el.tagName;
        if (tag === "attributes") {
          const dv = txt(el, "divisions");
          if (dv) divisions = +dv || divisions;
          const t = el.querySelector("time");
          if (t && !timeSig) {
            timeSig = { num: +(txt(t, "beats") || 4) || 4, den: +(txt(t, "beat-type") || 4) || 4 };
          }
        } else if (tag === "direction" || tag === "sound") {
          const snd = tag === "sound" ? el : el.querySelector("sound");
          const tempo = snd && snd.getAttribute("tempo");
          if (tempo && !bpm) bpm = Math.round(+tempo) || null;
        } else if (tag === "backup") {
          pos -= Math.round((+txt(el, "duration") || 0) * tpq / divisions);
        } else if (tag === "forward") {
          pos += Math.round((+txt(el, "duration") || 0) * tpq / divisions);
        } else if (tag === "note") {
          const isGrace = !!el.querySelector("grace");
          const dur = Math.round((+txt(el, "duration") || 0) * tpq / divisions);
          const isChord = !!el.querySelector("chord");
          const start = isChord ? lastStart : pos;
          if (!isGrace) {
            const p = el.querySelector("pitch");
            if (p && !el.querySelector("rest")) {
              const step = STEP[txt(p, "step")] || 0;
              const alter = +(txt(p, "alter") || 0) || 0;
              const oct = +(txt(p, "octave") || 4);
              const pitch = (oct + 1) * 12 + step + alter;
              const ties = [...el.querySelectorAll("tie")].map(t => t.getAttribute("type"));
              const tieStop = ties.includes("stop"), tieStart = ties.includes("start");
              const open = openTies[pitch];
              if (tieStop && open && Math.abs(open.start + open.dur - start) <= 2) {
                open.dur += dur; // tied continuation: extend, don't re-attack
                if (!tieStart) delete openTies[pitch];
              } else {
                const n = { pitch, start, dur: Math.max(1, dur) };
                notes.push(n);
                if (tieStart) openTies[pitch] = n; else delete openTies[pitch];
              }
            }
            if (!isChord) { lastStart = start; pos = start + dur; }
          }
        }
      }
    });
    if (notes.length) {
      notes.sort((a, b) => a.start - b.start || a.pitch - b.pitch);
      tracks.push({
        name: partNames[part.getAttribute("id")] || "Part " + (pi + 1),
        instr: null, notes, ch: pi % 16, isDrums: false,
        lo: Math.min(...notes.map(n => n.pitch)),
        hi: Math.max(...notes.map(n => n.pitch)),
      });
    }
  });
  if (!tracks.length) throw new Error("No notes found in the MusicXML.");
  tracks.sort((a, b) => b.notes.length - a.notes.length);
  return { tpq, timeSig: timeSig || { num: 4, den: 4 }, tracks, format: "musicxml", bpm: bpm || 120 };
}

/* ---------- Event grouping (chords) ---------- */

function groupEvents(notes, transpose, tpq) {
  const tol = Math.max(1, Math.round(tpq / 16));
  const events = [];
  let cur = null;
  for (const n of notes) {
    const pitch = n.pitch + transpose;
    if (cur && n.start - cur.tick <= tol) {
      cur.pitches.push(pitch);
      cur.dur = Math.max(cur.dur, n.dur);
      if (n.dom) cur.prot.add(pitch);
    } else {
      cur = { tick: n.start, dur: n.dur, pitches: [pitch], prot: new Set(n.dom ? [pitch] : []) };
      events.push(cur);
    }
  }
  for (const ev of events) {
    ev.pitches = [...new Set(ev.pitches)].sort((a, b) => a - b);
    if (ev.pitches.length > 6) {
      const protArr = ev.pitches.filter(p => ev.prot.has(p));
      const rest = ev.pitches.filter(p => !ev.prot.has(p));
      const keep = protArr.slice(0, 6);
      if (keep.length < 6 && rest.length && !keep.includes(rest[0])) keep.push(rest[0]);
      for (let i = rest.length - 1; i >= 0 && keep.length < 6; i--) {
        if (!keep.includes(rest[i])) keep.push(rest[i]);
      }
      ev.pitches = keep.sort((a, b) => a - b);
    }
  }
  return events;
}

/* ---------- Fretting engine (beam search) ---------- */

function scoreFingering(notes) {
  const fretted = notes.filter(n => n.f > 0).map(n => n.f);
  const span = fretted.length ? Math.max(...fretted) - Math.min(...fretted) : 0;
  const avg = fretted.length ? fretted.reduce((a, b) => a + b, 0) / fretted.length : 0;
  const highPen = fretted.reduce((a, f) => a + Math.max(0, f - 12) * 0.8, 0);
  const openBonus = (notes.length - fretted.length) * 0.9;
  const cost = span * 2.5 + avg * 0.35 + highPen - openBonus;
  const pos = fretted.length ? Math.min(...fretted) : 0;
  return { notes, cost, pos, hasFretted: fretted.length > 0 };
}

function chordCandidates(pitches, tuning, maxFret, cap = 24) {
  const per = pitches.map(pt => {
    const opts = [];
    for (let s = 0; s < 6; s++) {
      const f = pt - tuning[s];
      if (f >= 0 && f <= maxFret) opts.push({ s, f, pitch: pt });
    }
    return opts;
  });
  const results = [];
  const assign = (i, usedMask, acc, lo, hi) => {
    if (results.length >= 300) return;
    if (i === per.length) { results.push(acc.slice()); return; }
    for (const o of per[i]) {
      if (usedMask & (1 << o.s)) continue;
      let nlo = lo, nhi = hi;
      if (o.f > 0) { nlo = Math.min(lo, o.f); nhi = Math.max(hi, o.f); if (nhi - nlo > 4) continue; }
      acc.push(o);
      assign(i + 1, usedMask | (1 << o.s), acc, nlo, nhi);
      acc.pop();
    }
  };
  assign(0, 0, [], 99, -1);
  const scored = results.map(notes => scoreFingering(notes));
  scored.sort((a, b) => a.cost - b.cost);
  return scored.slice(0, cap);
}

const evKey = (ev) => ev.tick + "_" + ev.pitches.join(".");

function validOverride(notes, pitches, tuning, maxFret) {
  if (!notes || notes.length !== pitches.length) return false;
  const ps = notes.map(n => n.pitch).sort((a, b) => a - b);
  for (let i = 0; i < pitches.length; i++) if (ps[i] !== pitches[i]) return false;
  const used = new Set();
  for (const n of notes) {
    if (used.has(n.s) || n.f < 0 || n.f > maxFret || tuning[n.s] + n.f !== n.pitch) return false;
    used.add(n.s);
  }
  return true;
}

function fretPass(events, tuning, maxFret, fold, opts = {}) {
  const loLimit = Math.min(...tuning);
  const hiLimit = Math.max(...tuning) + maxFret;
  const BEAM = opts.beam || 14;
  const CAND = opts.candCap || 24;
  const out = [];
  let dropped = 0, folded = 0;

  // Preprocess pitches per event (fold or drop out-of-range), carrying the
  // protected lead-track set through any octave folding.
  const prepped = events.map(ev => {
    const ok = [];
    const prot = new Set();
    const srcProt = ev.prot || new Set();
    for (let pt of ev.pitches) {
      const wasProt = srcProt.has(pt);
      if (pt < loLimit || pt > hiLimit) {
        if (fold) {
          while (pt < loLimit) pt += 12;
          while (pt > hiLimit) pt -= 12;
          folded++;
          ok.push(pt);
          if (wasProt) prot.add(pt);
        } else dropped++;
      } else { ok.push(pt); if (wasProt) prot.add(pt); }
    }
    return { ...ev, pitches: [...new Set(ok)].sort((a, b) => a - b), prot };
  }).filter(ev => ev.pitches.length > 0);

  let beam = [{ cost: 0, pos: 0, path: [] }];
  let prevTick = prepped.length ? prepped[0].tick : 0;
  const tpqGuess = 480;

  for (let i = 0; i < prepped.length; i++) {
    const ev = prepped[i];
    let cands = chordCandidates(ev.pitches, tuning, maxFret, CAND);
    const ov = opts.overrides && opts.overrides[evKey(ev)];
    if (ov && validOverride(ov, ev.pitches, tuning, maxFret)) cands = [scoreFingering(ov)];
    if (!cands.length) { dropped += ev.pitches.length; continue; }
    const gap = ev.tick - prevTick;
    const moveWeight = Math.max(0.4, Math.min(2.2, 2.2 - gap / tpqGuess));
    const next = [];
    for (const st of beam) {
      for (const c of cands) {
        const pos = c.hasFretted ? c.pos : st.pos;
        const move = c.hasFretted ? Math.abs(pos - st.pos) : 0;
        next.push({
          cost: st.cost + c.cost + move * moveWeight,
          pos,
          path: st.path.concat([{ tick: ev.tick, dur: ev.dur, notes: c.notes, prot: ev.prot }]),
        });
      }
    }
    next.sort((a, b) => a.cost - b.cost);
    // dedupe by position to keep beam diverse
    const seen = new Set(); const kept = [];
    for (const st of next) {
      const key = st.pos + ":" + st.path[st.path.length - 1].notes.map(n => n.s + "." + n.f).join(",");
      if (seen.has(key)) continue;
      seen.add(key); kept.push(st);
      if (kept.length >= BEAM) break;
    }
    beam = kept.length ? kept : next.slice(0, BEAM);
    prevTick = ev.tick;
  }
  const best = beam.sort((a, b) => a.cost - b.cost)[0];
  return { events: best ? best.path : [], dropped, folded };
}

/* ---------- Difficulty scoring ---------- */

function difficultyOf(fretted, oorFrac) {
  const n = fretted.length;
  if (!n) return { pct: 0, label: "—", avgMove: 0, avgSpan: 0, avgFret: 0 };
  let move = 0, moves = 0, span = 0, fretSum = 0, frettedCount = 0, prevPos = null;
  for (const ev of fretted) {
    const fr = ev.notes.filter(x => x.f > 0).map(x => x.f);
    if (fr.length) {
      const pos = Math.min(...fr);
      if (prevPos != null) { move += Math.abs(pos - prevPos); moves++; }
      prevPos = pos;
      span += Math.max(...fr) - Math.min(...fr);
      fretSum += fr.reduce((a, b) => a + b, 0);
      frettedCount += fr.length;
    }
  }
  const avgMove = moves ? move / moves : 0;
  const avgSpan = span / n;
  const avgFret = frettedCount ? fretSum / frettedCount : 0;
  const raw = 11 * avgMove + 8 * avgSpan + 2.1 * avgFret + 90 * (oorFrac || 0);
  const pct = Math.max(1, Math.min(99, Math.round(100 * (1 - Math.exp(-raw / 26)))));
  const label = pct < 20 ? "Easy" : pct < 40 ? "Moderate" : pct < 60 ? "Demanding" : pct < 80 ? "Hard" : "Very hard";
  return { pct, label, avgMove, avgSpan, avgFret };
}

function sampleEvents(events, limit) {
  if (events.length <= limit) return events;
  const step = events.length / limit;
  const out = [];
  for (let i = 0; i < limit; i++) out.push(events[Math.floor(i * step)]);
  return out;
}

/* ---------- Arrangement thinning ---------- */

function thinEvents(events, level) {
  if (!level) return { events, removed: 0 };
  let removed = 0;
  const out = events.map(ev => {
    let ps = ev.pitches; // sorted ascending, unique
    const prot = ev.prot || new Set();
    if (ps.length > 1) {
      const top = ps[ps.length - 1];
      // Level 1+: drop notes doubled in another octave. Keep the lowest of each
      // pitch class (the bass voicing), the top note (melody), and anything
      // from the protected lead track.
      const seenPC = new Set();
      const keep = [];
      for (const p of ps) {
        const pc = p % 12;
        if (!seenPC.has(pc) || p === top || prot.has(p)) { seenPC.add(pc); keep.push(p); }
        else removed++;
      }
      ps = keep;
      // Level 2: keep bass, melody, protected notes, and the strongest colour
      // tones; free voices cap so chords stay compact.
      if (level >= 2 && ps.length > 2) {
        const bass = ps[0], melody = ps[ps.length - 1];
        const inner = ps.slice(1, -1);
        const protInner = inner.filter(p => prot.has(p));
        const free = inner.filter(p => !prot.has(p));
        const rank = (p) => {
          const iv = (p - bass) % 12;
          if (iv === 3 || iv === 4) return 3;      // third — defines major/minor
          if (iv === 10 || iv === 11) return 2.5;  // seventh — defines function
          if (iv === 7) return 1;                  // fifth — reinforces, adds little
          if (iv === 0) return 0;                  // octave/unison double
          return 2;                                // colour and tension tones
        };
        const slots = Math.max(0, 2 - protInner.length);
        const kept = free.map(p => ({ p, r: rank(p) }))
          .sort((a, b) => b.r - a.r || a.p - b.p)
          .slice(0, slots).map(x => x.p);
        removed += free.length - kept.length;
        ps = [...new Set([bass, ...protInner, ...kept, melody])].sort((a, b) => a - b);
      }
    }
    return { ...ev, pitches: ps };
  });
  return { events: out, removed };
}

/* ---------- Classical guitar arrangement ---------- */

// Krumhansl-Schmuckler key profiles
const KS_MAJ = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88];
const KS_MIN = [6.33, 2.68, 3.52, 5.38, 2.60, 3.53, 2.54, 4.75, 3.98, 2.69, 3.34, 3.17];

function detectKey(events) {
  const hist = Array(12).fill(0);
  for (const ev of events) for (const p of ev.pitches) hist[p % 12] += Math.max(1, ev.dur);
  const corr = (profile, rot) => {
    let sx = 0, sy = 0, sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < 12; i++) {
      const x = hist[i], y = profile[(i - rot + 12) % 12];
      sx += x; sy += y; sxy += x * y; sxx += x * x; syy += y * y;
    }
    const num = 12 * sxy - sx * sy;
    const den = Math.sqrt((12 * sxx - sx * sx) * (12 * syy - sy * sy));
    return den ? num / den : 0;
  };
  let best = { score: -2, tonic: 0, minor: false };
  for (let t = 0; t < 12; t++) {
    const cM = corr(KS_MAJ, t), cm = corr(KS_MIN, t);
    if (cM > best.score) best = { score: cM, tonic: t, minor: false };
    if (cm > best.score) best = { score: cm, tonic: t, minor: true };
  }
  return best;
}

function classicalArrange(events, tpq, timeSig) {
  if (!events.length) return { events, removed: 0, keyName: null };
  const beat = tpq;
  const measureTicks = Math.round(timeSig.num * tpq * 4 / timeSig.den);
  const key = detectKey(events);
  const keyName = NOTE_NAMES[key.tonic] + (key.minor ? " minor" : " major");
  const scalePCs = new Set(
    (key.minor ? [0, 2, 3, 5, 7, 8, 10, 11] : [0, 2, 4, 5, 7, 9, 11]).map(x => (x + key.tonic) % 12)
  );

  // Local melody register: sliding median of event tops, so an accompaniment
  // figure in a low register isn't mistaken for the tune.
  const tops = events.map(ev => ev.pitches[ev.pitches.length - 1]);
  const melodyRef = tops.map((_, i) => {
    const w = tops.slice(Math.max(0, i - 8), Math.min(tops.length, i + 9)).slice().sort((a, b) => a - b);
    return w[Math.floor(w.length / 2)];
  });

  const lastAttack = {}; // pitch -> { tick, dur } of its last kept strike
  let removed = 0;
  const out = events.map((ev, i) => {
    const prot = ev.prot || new Set();
    const ps = ev.pitches;
    if (!ps.length) return ev;
    const top = ps[ps.length - 1], bass = ps[0];
    const isMelodyTop = top >= melodyRef[i] - 7;
    const onBeat = (ev.tick % beat) < tpq / 8;
    const onDownbeat = (ev.tick % measureTicks) < tpq / 8;

    // Voice budget breathes with melodic activity: lean in fast passages,
    // fuller where the music can sit on a chord.
    const nextGap = i + 1 < events.length ? events[i + 1].tick - ev.tick : beat * 2;
    const budget = nextGap < beat / 2 ? 2 : nextGap < beat ? 3 : onDownbeat ? 5 : 4;

    const scored = ps.map(p => {
      let s = 0;
      const isTop = p === top, isBass = p === bass && ps.length > 1;
      if (isTop && isMelodyTop) s += 4;                     // the tune
      if (isBass) s += onBeat ? 3 : 1.5;                    // structural bass
      if (onDownbeat) s += 1.5; else if (onBeat) s += 0.75; // metric weight
      s += Math.min(2, ev.dur / beat);                      // longer = more structural
      if (!isBass) {                                        // harmonic function vs the bass
        const iv = (p - bass) % 12;
        if (iv === 3 || iv === 4) s += 1.5;                 // third
        else if (iv === 10 || iv === 11) s += 1.25;         // seventh
        else if (iv === 0) s -= 1.5;                        // octave double
        else if (iv === 7) s += 0.2;                        // fifth
        else s += 0.9;                                      // colour / tension
      }
      if (!scalePCs.has(p % 12)) s += 0.5;                  // chromatic notes are usually expressive
      // Repeated-note suppression: if this pitch was struck recently, the
      // string is still ringing — re-plucking it mid-texture adds clutter,
      // unless it's the melody or the bass restating a strong beat.
      const la = lastAttack[p];
      if (la) {
        const ring = Math.min(la.dur * 1.5, beat * 2);
        if (ev.tick - la.tick < ring && !(isTop && isMelodyTop) && !(isBass && onBeat)) s -= 3;
      }
      if (prot.has(p)) s += 100;                            // lead track is untouchable
      return { p, s };
    });

    scored.sort((a, b) => b.s - a.s);
    const keep = [];
    for (const c of scored) {
      const must = (c.p === top && isMelodyTop) || prot.has(c.p);
      if ((keep.length < budget || must) && (c.s > -0.5 || must)) keep.push(c.p);
      else removed++;
    }
    for (const p of keep) lastAttack[p] = { tick: ev.tick, dur: ev.dur };
    return { ...ev, pitches: [...new Set(keep)].sort((a, b) => a - b) };
  }).filter(ev => ev.pitches.length > 0);

  return { events: out, removed, keyName };
}

/* ---------- ASCII tab ---------- */

function layoutTab(fretted, tuning, tpq, measureTicks) {
  if (!fretted.length) return { blocks: [], text: "" };
  const labels = [5, 4, 3, 2, 1, 0].map(i => {
    const nm = NOTE_NAMES[tuning[i] % 12];
    return i === 5 ? nm.toLowerCase() : nm;
  });
  const lw = Math.max(...labels.map(l => l.length));
  const beatsPerMeasure = Math.max(1, Math.round(measureTicks / tpq));

  // Group events by bar
  const byBar = new Map();
  fretted.forEach((ev, i) => {
    const m = Math.floor(ev.tick / measureTicks);
    if (!byBar.has(m)) byBar.set(m, []);
    byBar.get(m).push(i);
  });
  const firstBar = Math.floor(fretted[0].tick / measureTicks);
  const lastBar = Math.floor(fretted[fretted.length - 1].tick / measureTicks);

  // Build each bar as a uniform grid: one resolution for the whole bar,
  // chosen as the coarsest subdivision that every attack in the bar lands on.
  const SUBS = [1, 2, 3, 4, 6, 8];
  const tol = tpq / 16;
  const bars = [];
  for (let m = firstBar; m <= lastBar; m++) {
    const idxs = byBar.get(m) || [];
    let r = 1;
    for (const cand of SUBS) {
      r = cand;
      const step = tpq / cand;
      const ok = idxs.every(i => {
        const off = fretted[i].tick - m * measureTicks;
        return Math.abs(off - Math.round(off / step) * step) <= tol;
      });
      if (ok) break;
    }
    const slots = beatsPerMeasure * r;
    const step = measureTicks / slots;
    const slotEvs = Array(slots).fill(null);
    for (const i of idxs) {
      let sIdx = Math.round((fretted[i].tick - m * measureTicks) / step);
      sIdx = Math.min(slots - 1, Math.max(0, sIdx));
      (slotEvs[sIdx] = slotEvs[sIdx] || []).push(i);
    }
    // Digit width for the bar: widest fret number, and room for the beat count
    let maxDig = String(beatsPerMeasure).length;
    for (const i of idxs) for (const n of fretted[i].notes) maxDig = Math.max(maxDig, String(n.f).length);
    const pad = r <= 2 ? 3 : r <= 4 ? 2 : 1; // sparse bars breathe, dense bars stay compact
    const slotW = maxDig + pad;

    const cols = [];
    for (let sIdx = 0; sIdx < slots; sIdx++) {
      const evList = slotEvs[sIdx];
      const isBeat = sIdx % r === 0;
      const isHalf = r > 1 && r % 2 === 0 && sIdx % r === r / 2;
      const mark = isBeat ? String(sIdx / r + 1) : isHalf ? "+" : "";
      const tok = Array(6).fill(null);
      const leadLine = Array(6).fill(false);
      let evIndex = null;
      if (evList) {
        evIndex = evList[0];
        for (const i of evList) {
          const ev = fretted[i];
          for (const n of ev.notes) {
            if (tok[5 - n.s] == null) {
              tok[5 - n.s] = String(n.f);
              if (ev.prot && ev.prot.has(n.pitch)) leadLine[5 - n.s] = true;
            }
          }
        }
      }
      const num = tok.map(t => t == null ? null : { start: Math.max(0, maxDig - t.length), len: t.length });
      cols.push({
        kind: evIndex != null ? "ev" : "grid",
        evIndex, lead: leadLine, num,
        onBeat: isBeat, downbeat: isBeat && sIdx === 0,
        ruler: mark.padStart(maxDig, " ").padEnd(slotW, " "),
        cells: tok.map(t => (t == null ? "-".repeat(maxDig) : t.padStart(maxDig, "-")) + "-".repeat(slotW - maxDig)),
      });
    }
    bars.push(cols);
  }

  // Assemble bars into wrapped blocks; wraps only happen at barlines.
  const openCol = () => ({ kind: "open", ruler: " ".repeat(lw + 2), cells: labels.map(l => l.padEnd(lw, " ") + "|-") });
  const barSep = () => ({ kind: "bar", ruler: "| ", cells: Array(6).fill("|-") });
  const closeCol = () => ({ kind: "close", ruler: "|", cells: Array(6).fill("|") });
  const blocks = [];
  let cur = [openCol()];
  let curLen = lw + 2;
  const flush = () => {
    if (cur.length > 1 && cur[cur.length - 1].kind === "bar") cur.pop();
    cur.push(closeCol());
    blocks.push(cur);
    cur = [openCol()];
    curLen = lw + 2;
  };
  for (const cols of bars) {
    const barW = cols.reduce((a, c) => a + c.cells[0].length, 0);
    if (cur.length > 1 && curLen + barW > 72) flush();
    cur.push(...cols);
    cur.push(barSep());
    curLen += barW + 2;
  }
  if (cur.length > 1) flush();

  const text = blocks.map(b =>
    [b.map(c => c.ruler).join("")]
      .concat([0, 1, 2, 3, 4, 5].map(li => b.map(c => c.cells[li]).join("")))
      .join("\n")
  ).join("\n\n");
  return { blocks, text };
}

/* ---------- Playback synth ---------- */

function pluck(ctx, out, freq, t, dur) {
  const osc = ctx.createOscillator(); osc.type = "triangle"; osc.frequency.value = freq;
  const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2;
  const g2 = ctx.createGain(); g2.gain.value = 0.12;
  const f = ctx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(Math.min(8000, freq * 6), t);
  f.frequency.exponentialRampToValueAtTime(Math.max(300, freq * 1.4), t + Math.max(0.25, dur));
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.32, t + 0.007);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.25, dur));
  osc.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(out);
  osc.start(t); o2.start(t);
  osc.stop(t + dur + 0.15); o2.stop(t + dur + 0.15);
}

/* ---------- MusicXML ---------- */

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function buildMusicXML(fretted, tpq, timeSig, tuning, title) {
  const measureTicks = Math.round(timeSig.num * tpq * 4 / timeSig.den);
  // Build a flat timeline: rests + notes, durations clipped to measure boundaries.
  const items = [];
  let cursor = fretted.length ? Math.floor(fretted[0].tick / measureTicks) * measureTicks : 0;
  const firstMeasureStart = cursor;
  for (let i = 0; i < fretted.length; i++) {
    const ev = fretted[i];
    if (ev.tick > cursor) {
      let gap = ev.tick - cursor;
      while (gap > 0) {
        const mEnd = Math.floor(cursor / measureTicks) * measureTicks + measureTicks;
        const take = Math.min(gap, mEnd - cursor);
        items.push({ dur: take, notes: null, at: cursor });
        cursor += take; gap -= take;
      }
    } else if (ev.tick < cursor) {
      continue; // overlapping event, skip to keep timeline monotonic
    }
    const nextTick = i + 1 < fretted.length ? fretted[i + 1].tick : ev.tick + ev.dur;
    let dur = Math.max(1, Math.min(ev.dur, nextTick - ev.tick || ev.dur));
    const mEnd = Math.floor(cursor / measureTicks) * measureTicks + measureTicks;
    dur = Math.min(dur, mEnd - cursor);
    if (dur < 1) dur = 1;
    items.push({ dur, notes: ev.notes, at: cursor });
    cursor += dur;
  }
  // Emit measures
  const STEPS = ["C", "C", "D", "D", "E", "F", "F", "G", "G", "A", "A", "B"];
  const ALTER = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 4.0 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">\n';
  xml += '<score-partwise version="4.0">\n<work><work-title>' + esc(title) + "</work-title></work>\n";
  xml += '<part-list><score-part id="P1"><part-name>Guitar</part-name></score-part></part-list>\n<part id="P1">\n';
  let mNum = 1, mStart = firstMeasureStart, open = false;
  const tuningXML = tuning.map((pt, i) =>
    '<staff-tuning line="' + (i + 1) + '"><tuning-step>' + STEPS[pt % 12] + "</tuning-step>" +
    (ALTER[pt % 12] ? "<tuning-alter>1</tuning-alter>" : "") +
    "<tuning-octave>" + (Math.floor(pt / 12) - 1) + "</tuning-octave></staff-tuning>").join("");
  const openMeasure = () => {
    xml += '<measure number="' + mNum + '">\n';
    if (mNum === 1) {
      xml += "<attributes><divisions>" + tpq + "</divisions><key><fifths>0</fifths></key>" +
        "<time><beats>" + timeSig.num + "</beats><beat-type>" + timeSig.den + "</beat-type></time>" +
        "<clef><sign>TAB</sign><line>5</line></clef>" +
        "<staff-details><staff-lines>6</staff-lines>" + tuningXML + "</staff-details></attributes>\n";
    }
    open = true;
  };
  for (const it of items) {
    while (it.at >= mStart + measureTicks) {
      if (open) { xml += "</measure>\n"; open = false; }
      mStart += measureTicks; mNum++;
    }
    if (!open) openMeasure();
    if (!it.notes) {
      xml += "<note><rest/><duration>" + it.dur + "</duration><voice>1</voice></note>\n";
    } else {
      const sorted = [...it.notes].sort((a, b) => a.pitch - b.pitch);
      sorted.forEach((n, idx) => {
        const pc = n.pitch % 12, oct = Math.floor(n.pitch / 12) - 1;
        xml += "<note>" + (idx > 0 ? "<chord/>" : "") +
          "<pitch><step>" + STEPS[pc] + "</step>" + (ALTER[pc] ? "<alter>1</alter>" : "") +
          "<octave>" + oct + "</octave></pitch><duration>" + it.dur + "</duration><voice>1</voice>" +
          "<notations><technical><string>" + (6 - n.s) + "</string><fret>" + n.f + "</fret></technical></notations></note>\n";
      });
    }
  }
  if (open) xml += "</measure>\n";
  xml += "</part>\n</score-partwise>\n";
  return xml;
}

/* ---------- PDF writer (hand-rolled, no dependencies) ---------- */

function makePdf({ title, subtitle, blocks, footerBrand }) {
  const W = 595.28, H = 841.89, M = 64; // A4, generous LaTeX-like margins
  const escP = (s) => String(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)").replace(/[^\x20-\x7E]/g, "?");
  // Approximate Times metrics, good enough for visual centring
  const chW = (ch) => {
    if ("iljI.,:;'!|()[]".includes(ch)) return 0.30;
    if ("ftr-\"".includes(ch)) return 0.36;
    if ("mMW".includes(ch)) return 0.89;
    if (ch === "w") return 0.72;
    if (ch === " ") return 0.25;
    if (ch >= "A" && ch <= "Z") return 0.68;
    return 0.48;
  };
  const measure = (s, size) => { let t = 0; for (const ch of String(s)) t += chW(ch); return t * size; };

  const pages = [];
  let ops = [];
  let y = H - M;
  const put = (font, size, x, yy, s) =>
    ops.push("BT /" + font + " " + size + " Tf 1 0 0 1 " + x.toFixed(1) + " " + yy.toFixed(1) + " Tm (" + escP(s) + ") Tj ET");
  const center = (font, size, yy, s) => put(font, size, Math.max(M, (W - measure(s, size)) / 2), yy, s);
  const gray = (g) => ops.push(g + " g");
  const rule = (yy, wd, g) => ops.push(wd + " w " + g + " G " + M + " " + yy.toFixed(1) + " m " + (W - M) + " " + yy.toFixed(1) + " l S 0 G");

  const flushPage = () => {
    pages.push(ops); ops = [];
    // running header on continuation pages
    gray(0.35); put("F4", 9, M, H - 42, title); gray(0);
    rule(H - 50, 0.5, 0.8);
    y = H - 74;
  };

  // Title block, \maketitle style: centred title, centred italic byline, rule
  y -= 14;
  center("F1", 21, y, title); y -= 18;
  if (subtitle) { gray(0.4); center("F4", 10, y, subtitle); gray(0); y -= 15; }
  rule(y, 0.6, 0.75); y -= 28;

  const LH = 10.5;
  for (const b of blocks) {
    const lines = b.lines, leads = b.leads;
    const h = (b.ruler ? LH : 0) + lines.length * LH + 16;
    if (y - h < M + 30) flushPage();
    if (b.ruler) { gray(0.55); put("F3", 8.5, M, y - 8.5, b.ruler); gray(0); y -= LH; }
    lines.forEach((line, li) => {
      const segs = leads && leads[li] && leads[li].length ? leads[li] : null;
      if (!segs) put("F3", 8.5, M, y - 8.5, line);
      else {
        const base = line.split("");
        for (const sg of segs) for (let k = sg.start; k < sg.start + sg.len; k++) base[k] = " ";
        put("F3", 8.5, M, y - 8.5, base.join(""));
        ops.push("0.28 0.52 0.68 rg"); // lead colour
        for (const sg of segs) put("F3", 8.5, M + sg.start * 5.1, y - 8.5, line.slice(sg.start, sg.start + sg.len));
        ops.push("0 g");
      }
      y -= LH;
    });
    y -= 16;
  }
  pages.push(ops);

  const n = pages.length;
  pages.forEach((p, i) => {
    const saved = ops; ops = p;
    gray(0.35);
    put("F4", 8.5, M, 30, footerBrand);
    const pn = String(i + 1);
    put("F2", 9.5, (W - measure(pn, 9.5)) / 2, 30, pn);
    gray(0);
    ops = saved;
  });

  const objs = [];
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objs[2] = "<< /Type /Pages /Kids [" + pages.map((_, i) => (7 + i * 2) + " 0 R").join(" ") + "] /Count " + n + " >>";
  objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold >>";
  objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman >>";
  objs[5] = "<< /Type /Font /Subtype /Type1 /BaseFont /Courier >>";
  objs[6] = "<< /Type /Font /Subtype /Type1 /BaseFont /Times-Italic >>";
  pages.forEach((p, i) => {
    const pageNo = 7 + i * 2, contNo = pageNo + 1;
    objs[pageNo] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + W + " " + H + "] " +
      "/Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents " + contNo + " 0 R >>";
    const stream = p.join("\n");
    objs[contNo] = "<< /Length " + stream.length + " >>\nstream\n" + stream + "\nendstream";
  });
  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  for (let i = 1; i < objs.length; i++) {
    offsets[i] = pdf.length;
    pdf += i + " 0 obj\n" + objs[i] + "\nendobj\n";
  }
  const xref = pdf.length;
  pdf += "xref\n0 " + objs.length + "\n0000000000 65535 f \n";
  for (let i = 1; i < objs.length; i++) pdf += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  pdf += "trailer\n<< /Size " + objs.length + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF";
  return pdf;
}

function download(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 500);
}
